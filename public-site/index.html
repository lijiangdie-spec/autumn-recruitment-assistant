<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="秋招助手公开岗位信息源">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
  <title>秋招助手 · 公开岗位</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="page-header">
    <div>
      <h1>秋招岗位列表</h1>
      <p><span id="job-count">正在读取…</span><span aria-hidden="true"> · </span><span id="updated-at">版本校验中</span></p>
    </div>
    <a class="repo" href="https://github.com/lijiangdie-spec/autumn-recruitment-assistant" rel="noreferrer">GitHub ↗</a>
  </header>
  <main>
    <section class="toolbar" aria-label="岗位筛选">
      <label><span>搜索</span><input id="query" type="search" placeholder="公司、岗位或城市"></label>
      <label><span>城市</span><select id="city"><option value="">全部城市</option></select></label>
      <label><span>类型</span><select id="type"><option value="">全部类型</option><option value="campus">校招</option><option value="internship">实习</option><option value="unknown">待确认</option></select></label>
    </section>
    <div class="table-wrap">
      <table>
        <caption>公开招聘岗位</caption>
        <thead><tr><th>公司</th><th>岗位</th><th>城市</th><th>类型</th><th>截止日期</th><th>链接</th></tr></thead>
        <tbody id="jobs" aria-live="polite"></tbody>
      </table>
    </div>
    <p id="empty" class="empty" hidden>没有符合当前筛选的岗位。</p>
    <button id="load-more" class="load-more" hidden>显示更多岗位</button>
  </main>
  <footer>岗位信息以企业官方页面为准。本站不保存求职者资料。</footer>
  <script src="app.js" defer></script>
</body>
</html>
